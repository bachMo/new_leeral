name: leeral

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leeral
      POSTGRES_DB: leeral
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leeral -d leeral"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    image: leeral-api
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://leeral:${POSTGRES_PASSWORD}@postgres:5432/leeral
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: leeral-api
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://leeral:${POSTGRES_PASSWORD}@postgres:5432/leeral
      REDIS_URL: redis://redis:6379/0
    command: ["arq", "app.workers.settings.WorkerSettings"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN manquant dans .env}
    command: ["http", "--url=${NGROK_DOMAIN:?NGROK_DOMAIN manquant dans .env}", "api:8000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data: