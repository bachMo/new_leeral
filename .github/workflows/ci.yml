name: ci
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: leeral_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/leeral_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-used-in-production
      AI_PROVIDER: mock
      STORAGE_BACKEND: local
      OTP_DELIVERY: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - run: uv run pip-audit --skip-editable
