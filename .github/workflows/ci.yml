name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · format, lint, types, migrations, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: leeral_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/leeral_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-used-in-production
      AI_PROVIDER: mock
      STORAGE_BACKEND: local
      OTP_DELIVERY: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest
      - run: pip-audit --skip-editable

  mobile:
    name: Mobile · format, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,tsx}"
      - run: npm run typecheck
      - run: npx expo export --platform web --output-dir "$RUNNER_TEMP/web"