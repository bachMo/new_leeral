[project]
name = "leeral-api"
version = "1.0.0"
description = "Leeral backend: French documents explained aloud in Wolof and Pulaar."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "httpx>=0.27",
    "redis>=5.0,<6",
    "arq>=0.26",
    "boto3>=1.35",
    "pyjwt>=2.9",
    "phonenumbers>=8.13",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "fpdf2>=2.8",
    "lameenc>=1.7",
    "pillow>=10.4",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[project.scripts]
leeral = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ai.real.data" = ["*.csv"]
"app.assets" = ["fonts/*.ttf"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N", "PL"]
ignore = [
    "PLR0911",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "S101",
    "S105",
    "ASYNC109",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106"]
"app/db/base.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.services.media"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
